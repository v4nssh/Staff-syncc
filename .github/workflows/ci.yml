name: StaffSync CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Validate Backend Syntax
        run: |
          node -c server/server.js
          node -c server/seed.js
          node -c server/config/db.js
          for file in server/controllers/*.js server/models/*.js server/routes/*.js server/middleware/*.js; do
            node -c "$file"
          done

      - name: Install Client Dependencies
        run: npm --prefix client ci || npm --prefix client install

      - name: Build Frontend Client
        run: npm --prefix client run build

