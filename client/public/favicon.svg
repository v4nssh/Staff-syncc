  <!-- Synchronized orbit nodes -->
  <circle cx="78" cy="38" r="6" fill="#06b6d4" />
  <circle cx="50" cy="90" r="6" fill="#2563eb" />
  <circle cx="64" cy="64" r="4" fill="#ffffff" />
</svg>
