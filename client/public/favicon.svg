<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <!-- Synchronized node rings -->
  <circle cx="64" cy="64" r="44" stroke="#334155" stroke-width="2.5" fill="none" stroke-dasharray="6 6" />
  <!-- Stylized StaffSync S monogram with interconnected nodes -->
  <path d="M78 38 C70 34, 52 34, 46 44 C40 54, 52 60, 64 64 C76 68, 88 74, 82 84 C76 94, 58 94, 50 90" 
        fill="none" 
        stroke="url(#brandGrad)" 
        stroke-width="8" 
        stroke-linecap="round" 
